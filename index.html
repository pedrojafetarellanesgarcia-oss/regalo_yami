<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Sorpresa para Yami!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* --- VISTA DE LA TARJETA ABIERTA DESDE EL INICIO --- */
        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 440px;
            width: 92%;
            border: 4px solid #ffb3c6;
            z-index: 200;
            position: relative;
        }

        /* Contenedor del Pastel de Cumpleaños Vectorial */
        .cake-stage {
            width: 160px;
            height: 160px;
            margin: 0 auto 10px auto;
            background: #ffe5ec;
            border-radius: 50%;
            border: 4px solid #ff477e;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .characters-stage {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            height: 110px;
            margin-bottom: 15px;
            position: relative;
        }

        /* Ramo de Rosas */
        .roses-handful {
            position: absolute;
            top: 25px;
            right: -18px;
            display: flex;
            flex-wrap: wrap;
            width: 45px;
            z-index: 10;
        }

        .red-rose-dot {
            width: 10px;
            height: 10px;
            background: #e74c3c;
            border-radius: 50%;
            margin: 1px;
            box-shadow: inset 0 0 3px #c0392b;
            position: relative;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px #f1c40f;
            animation: flashSparkle 0.8s infinite alternate;
        }

        @keyframes flashSparkle {
            0% { opacity: 0.3; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        .message-board {
            background: #fff0f3;
            color: #4a4a4a;
            font-size: 1.15rem;
            font-weight: 500;
            line-height: 1.5;
            padding: 15px;
            border-radius: 12px;
            border-left: 5px solid #ff477e;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        /* Botón verde musical */
        .music-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            width: 100%;
        }

        /* --- EFECTOS FESTIVOS DESDE EL PRIMER SEGUNDO --- */
        .balloon {
            position: absolute;
            bottom: -150px;
            width: 45px;
            height: 60px;
            border-radius: 50%;
            z-index: 250;
            opacity: 0.85;
            animation: floatUp 6s linear infinite;
        }

        .petal {
            position: absolute;
            top: -50px;
            width: 15px;
            height: 15px;
            background: #e74c3c;
            border-radius: 15px 0 15px 12px;
            z-index: 250;
            opacity: 0.75;
            animation: fallDown 5s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-115vh) rotate(25deg); }
        }

        @keyframes fallDown {
            0% { transform: translateY(0) rotate(0deg) translateX(0); }
            100% { transform: translateY(115vh) rotate(360deg) translateX(50px); }
        }

        @keyframes flameFlicker {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.15) translateY(-1px); opacity: 1; }
        }
        .flame-node {
            animation: flameFlicker 0.5s infinite alternate;
        }
    </style>
</head>
<body>

    <script>
        // Iniciar las animaciones automáticamente al cargar la página
        window.onload = function() {
            for(let i = 0; i < 28; i++) {
                setTimeout(crearGlobo, i * 75);
                setTimeout(crearPetalo, i * 85);
            }
            // Repetir la lluvia de partículas continuamente
            setInterval(crearGlobo, 600);
            setInterval(crearPetalo, 600);
        };

        function tocarMusica() {
            var audio = document.getElementById('musicaSorpresa');
            if(audio) audio.play();
        }
