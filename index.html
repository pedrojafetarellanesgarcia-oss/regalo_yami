<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Sorpresa para Yami!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 35%, #ffd9e4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(255,255,255,0.4), transparent 35%);
            pointer-events: none;
        }

        #pantallaInicio {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffc2d1, #ffe5ec);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        #pantallaInicio.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .btn-abrir-sorpresa {
            background: linear-gradient(135deg, #ff477e, #ff7aa8);
            color: white;
            border: none;
            padding: 16px 35px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 71, 126, 0.35);
            animation: palpitar 1.5s infinite;
            margin-top: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-abrir-sorpresa:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255, 71, 126, 0.45);
        }

        @keyframes palpitar {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 22px 20px 18px;
            border-radius: 24px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.14);
            text-align: center;
            max-width: 440px;
            width: 92%;
            border: 4px solid #ffb3c6;
            z-index: 200;
            position: relative;
            display: block;
            opacity: 1;
            transition: transform 0.6s ease, opacity 0.6s ease;
        }

        .cake-stage {
            width: 164px;
            height: 164px;
            margin: 0 auto 10px auto;
            background: #ffe5ec;
            border-radius: 50%;
            border: 4px solid #ff477e;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 25px rgba(255, 71, 126, 0.15);
        }

        .characters-stage {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            height: 110px;
            margin-bottom: 15px;
            position: relative;
        }

        .roses-handful {
            position: absolute;
            top: 25px;
            right: -18px;
            display: flex;
            flex-wrap: wrap;
            width: 45px;
            z-index: 10;
        }

        .red-rose-dot {
            width: 10px;
            height: 10px;
            background: #e74c3c;
            border-radius: 50%;
            margin: 1px;
            box-shadow: inset 0 0 3px #c0392b;
            position: relative;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px #f1c40f;
            animation: flashSparkle 0.8s infinite alternate;
        }

        @keyframes flashSparkle {
            0% { opacity: 0.3; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        .message-board {
            background: #fff0f3;
            color: #4a4a4a;
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.6;
            padding: 15px 14px;
            border-radius: 14px;
            border-left: 5px solid #ff477e;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-top: 8px;
            margin-bottom: 5px;
        }

        .balloon-element {
            position: absolute;
            bottom: -80px;
            width: 40px;
            height: 55px;
            border-radius: 50%;
            z-index: 999;
            opacity: 0.85;
            pointer-events: none;
        }

        .petal-element {
            position: absolute;
            top: -40px;
            width: 14px;
            height: 14px;
            background: #e74c3c;
            border-radius: 14px 0 14px 11px;
            z-index: 999;
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes flameFlicker {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.15) translateY(-1px); opacity: 1; }
        }

        .flame-node {
            animation: flameFlicker 0.5s infinite alternate;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            color: #ff4d88;
            animation: floatUp 6s ease-in forwards;
            opacity: 0.8;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.6);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            100% {
                transform: translateY(-180px) scale(1.1) rotate(10deg);
                opacity: 0;
            }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 14px;
            opacity: 0.9;
            border-radius: 2px;
            animation: confettiFall 2.4s linear forwards;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(210px) rotate(540deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <audio id="musicaSorpresa" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" preload="auto" loop></audio>

    <div id="pantallaInicio">
        <svg width="100" height="110" viewBox="0 0 100 110" style="margin-bottom: 10px;">
            <ellipse cx="45" cy="80" rx="15" ry="20" fill="white" stroke="black" stroke-width="3"/>
            <ellipse cx="45" cy="38" rx="18" ry="15" fill="white" stroke="black" stroke-width="3"/>
            <path d="M 30,36 C 24,36 22,50 28,53 C 34,56 36,42 30,36" fill="black"/>
            <circle cx="48" cy="34" r="2.5" fill="black"/>
            <ellipse cx="61" cy="38" rx="3" ry="2.5" fill="black"/>
        </svg>
        <h2 style="color: #d9406f; font-size: 1.6rem; padding: 0 20px;">¡Yami, te dejaron un regalo especial! 🎁</h2>
        <button class="btn-abrir-sorpresa" onclick="entrarTarjeta()">👉 Ver Sorpresa 🌟</button>
    </div>

    <div class="card" id="birthdayCard">
        <h2 style="color: #ff477e; margin-bottom: 10px;">¡Feliz Cumpleaños Yami!</h2>

        <div class="cake-stage">
            <svg width="130" height="130" viewBox="0 0 120 120">
                <rect x="25" y="85" width="70" height="8" fill="#bdc3c7" rx="3"/>
                <rect x="32" y="55" width="56" height="30" fill="#ffb3c6" stroke="#ff477e" stroke-width="1.5"/>
                <rect x="32" y="65" width="56" height="5" fill="#ffffff"/>
                <rect x="42" y="32" width="36" height="23" fill="#ff7096" stroke="#ff477e" stroke-width="1.5"/>
                <circle cx="60" cy="32" r="5" fill="#e74c3c"/>
                <rect x="58" y="16" width="4" height="16" fill="#3498db"/>
                <polygon class="flame-node" points="60,2 56,14 64,14" fill="#f1c40f"/>
            </svg>
        </div>

        <div class="characters-stage">
            <div class="woodstock-box">
                <svg width="45" height="50" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="22" fill="#f1c40f" stroke="black" stroke-width="4"/>
                    <path d="M 35,32 Q 50,15 65,32" fill="none" stroke="black" stroke-width="4"/>
                    <circle cx="58" cy="45" r="3" fill="black"/>
                    <path d="M 68,48 Q 78,50 72,56 Z" fill="#f39c12" stroke="black" stroke-width="3"/>
                    <path d="M 45,72 L 40,88 M 55,72 L 60,88" stroke="black" stroke-width="4"/>
                </svg>
            </div>

            <div class="snoopy-box">
                <div class="roses-handful">
                    <div class="red-rose-dot"><div class="sparkle" style="top:-2px; left:2px;"></div></div>
                    <div class="red-rose-dot"></div>
                    <div class="red-rose-dot"><div class="sparkle" style="top:4px; left:6px;"></div></div>
                    <div class="red-rose-dot"></div>
                    <div class="red-rose-dot"></div>
                    <div class="red-rose-dot"></div>
                    <div class="red-rose-dot"><div class="sparkle" style="top:1px; left:-1px;"></div></div>
                    <div class="red-rose-dot"></div>
                    <div class="red-rose-dot"></div>
                    <div class="red-rose-dot"><div class="sparkle" style="top:3px; left:2px;"></div></div>
                    <div class="red-rose-dot"></div>
                    <div class="red-rose-dot"></div>
                    <div class="red-rose-dot"><div class="sparkle" style="top:-3px; left:4px;"></div></div>
                    <div class="red-rose-dot"></div>
                    <div class="red-rose-dot"></div>
                    <div class="red-rose-dot"><div class="sparkle" style="top:5px; left:1px;"></div></div>
                    <div class="red-rose-dot"></div>
                    <div class="red-rose-dot"></div>
                    <div class="red-rose-dot"><div class="sparkle" style="top:2px; left:5px;"></div></div>
                    <div class="red-rose-dot"></div>
                </div>
                <svg width="90" height="100" viewBox="0 0 100 110">
                    <ellipse cx="45" cy="80" rx="15" ry="20" fill="white" stroke="black" stroke-width="3"/>
                    <ellipse cx="38" cy="102" rx="7" ry="4" fill="white" stroke="black" stroke-width="3"/>
                    <ellipse cx="52" cy="102" rx="7" ry="4" fill="white" stroke="black" stroke-width="3"/>
                    <path d="M 33,72 C 40,65 52,65 58,70" fill="none" stroke="black" stroke-width="3.5"/>
                    <ellipse cx="45" cy="38" rx="18" ry="15" fill="white" stroke="black" stroke-width="3"/>
                    <path d="M 30,36 C 24,36 22,50 28,53 C 34,56 36,42 30,36" fill="black"/>
                    <circle cx="48" cy="34" r="2.5" fill="black"/>
                    <ellipse cx="61" cy="38" rx="3" ry="2.5" fill="black"/>
                </svg>
            </div>
        </div>

        <div class="message-board">
            Que este nuevo año te traiga muchísima alegría, amor y sueños cumplidos.<br>
            Gracias por ser tan especial. Te quiero mucho ❤️
        </div>
    </div>

    <script>
        function entrarTarjeta() {
            const pantalla = document.getElementById('pantallaInicio');
            const audio = document.getElementById('musicaSorpresa');

            if (pantalla) {
                pantalla.classList.add('hidden');
            }

            if (audio) {
                audio.volume = 0.4;
                audio.currentTime = 0;
                audio.play().catch(() => {
                    console.log('Audio bloqueado hasta la interacción del usuario.');
                });
            }

            crearCorazones();
            crearConfeti();
        }

        function crearCorazones() {
            const total = 12;
            for (let i = 0; i < total; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = i % 2 === 0 ? '❤' : '💖';
                heart.style.left = (Math.random() * 90 + 5) + '%';
                heart.style.bottom = '20px';
                heart.style.animationDelay = (Math.random() * 0.8) + 's';
                document.body.appendChild(heart);

                setTimeout(() => heart.remove(), 5500);
            }
        }

        function crearConfeti() {
            const colors = ['#ff477e', '#f9c74f', '#7bdff2', '#90be6d', '#ff9f1c', '#ff6b6b'];

            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.className = 'confetti';
                particle.style.left = (Math.random() * 100) + 'vw';
                particle.style.top = '-10px';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.transform = 'rotate(' + (Math.random() * 180) + 'deg)';
                particle.style.animationDelay = (Math.random() * 0.7) + 's';
                document.body.appendChild(particle);

                setTimeout(() => particle.remove(), 2600);
            }
        }
    </script>
</body>
</html>
