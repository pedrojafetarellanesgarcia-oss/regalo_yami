<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Sorpresa para Yami!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* --- VISTA 1: CAJA DE REGALO INICIAL --- */
        .gift-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            position: relative;
        }

        .box {
            position: relative;
            width: 180px;
            height: 160px;
            background: #ff477e;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            margin-top: 80px;
        }

        .box::before {
            content: '';
            position: absolute;
            width: 34px;
            height: 100%;
            background: #f1c40f;
            left: 50%;
            transform: translateX(-50%);
        }

        .lid {
            position: absolute;
            width: 196px;
            height: 40px;
            background: #ff7096;
            top: -40px;
            left: -8px;
            border-radius: 5px;
            box-shadow: 0 5px 5px rgba(0,0,0,0.1);
        }

        .lid::before {
            content: '';
            position: absolute;
            width: 34px;
            height: 100%;
            background: #f1c40f;
            left: 50%;
            transform: translateX(-50%);
            top: 0;
        }

        /* Adornos de flores arriba del regalo */
        .mini-flower {
            width: 22px;
            height: 22px;
            background: #ffb3c6;
            border-radius: 50%;
            position: absolute;
            top: -15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .mini-flower::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f1c40f;
            border-radius: 50%;
            top: 6px;
            left: 6px;
        }
        .flower-l { left: 25px; }
        .flower-r { right: 25px; }

        /* Moño amarillo */
        .bow-left {
            position: absolute;
            width: 35px;
            height: 30px;
            background: #f39c12;
            border-radius: 50% 50% 0 50%;
            transform: rotate(-15deg);
            top: -24px;
            left: 68px;
        }
        .bow-right {
            position: absolute;
            width: 35px;
            height: 30px;
            background: #f39c12;
            border-radius: 50% 50% 50% 0;
            transform: rotate(15deg);
            top: -24px;
            right: 68px;
        }
        .bow-center {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #f1c40f;
            border-radius: 50%;
            top: -15px;
            left: 90px;
            z-index: 10;
        }

        .tap-instruction {
            color: #d9406f;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 25px;
            background: white;
            padding: 8px 25px;
            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- VISTA 2: TARJETA INTERIOR SURGIDA --- */
        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 440px;
            width: 92%;
            border: 4px solid #ffb3c6;
            display: none;
            z-index: 200;
            position: relative;
        }

        /* Contenedor SVG para el Pastel de Cumpleaños Vectorial */
        .cake-stage {
            width: 160px;
            height: 160px;
            margin: 0 auto 10px auto;
            background: #ffe5ec;
            border-radius: 50%;
            border: 4px solid #ff477e;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .characters-stage {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            height: 110px;
            margin-bottom: 15px;
            position: relative;
        }

        /* Ramo de Rosas */
        .roses-handful {
            position: absolute;
            top: 25px;
            right: -18px;
            display: flex;
            flex-wrap: wrap;
            width: 45px;
            z-index: 10;
        }

        .red-rose-dot {
            width: 10px;
            height: 10px;
            background: #e74c3c;
            border-radius: 50%;
            margin: 1px;
            box-shadow: inset 0 0 3px #c0392b;
            position: relative;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px #f1c40f;
            animation: flashSparkle 0.8s infinite alternate;
        }

        @keyframes flashSparkle {
            0% { opacity: 0.3; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        .message-board {
            background: #fff0f3;
            color: #4a4a4a;
            font-size: 1.15rem;
            font-weight: 500;
            line-height: 1.5;
            padding: 15px;
            border-radius: 12px;
            border-left: 5px solid #ff477e;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        /* Botón verde para activar la música en celular */
        .music-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            width: 100%;
        }

        /* --- EFECTOS FESTIVOS AL FRENTE --- */
        .balloon {
            position: absolute;
            bottom: -150px;
            width: 45px;
            height: 60px;
            border-radius: 50%;
            z-index: 250; /* Por encima de todo */
            opacity: 0.85;
            animation: floatUp 6s linear infinite;
        }

        .petal {
            position: absolute;
            top: -50px;
            width: 15px;
            height: 15px;
            background: #e74c3c;
            border-radius: 15px 0 15px 12px;
            z-index: 250;
            opacity: 0.75;
            animation: fallDown 5s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-115vh) rotate(25deg); }
        }

        @keyframes fallDown {
            0% { transform: translateY(0) rotate(0deg) translateX(0); }
            100% { transform: translateY(115vh) rotate(360deg) translateX(50px); }
        }

        /* Animación parpadeante de la vela */
        @keyframes flameFlicker {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.15) translateY(-1px); opacity: 1; }
        }
        .flame-node {
            animation: flameFlicker 0.5s infinite alternate;
        }
    </style>
</head>
<body>

    <!-- AUDIO EN INTERNET (LAS MAÑANITAS DE CEPILLÍN) -->
    <audio id="musicaSorpresa" src="https://archive.org" preload="auto"></audio>

    <!-- CAJA DE REGALO -->
    <div class="gift-container" id="giftBox" onclick="abrirRegalo()">
        <div class="box">
            <div class="lid">
                <div class="mini-flower flower-l"></div>
                <div class="bow-left"></div>
                <div class="bow-center"></div>
                <div class="bow-right"></div>
                <div class="mini-flower flower-r" style="background:#ff7096;"></div>
            </div>
        </div>
        <div class="tap-instruction">🎁 ¡Toca el regalo para abrirlo!</div>
    </div>

    <!-- TARJETA INTERIOR -->
    <div class="card" id="birthdayCard">
        <h2 style="color: #ff477e; margin-bottom: 10px;">¡Feliz Cumpleaños Yami!</h2>
        
        <!-- Pastel de cumpleaños en vectores SVG con vela animada -->
        <div class="cake-stage">
            <svg width="130" height="130" viewBox="0 0 120 120">
                <rect x="25" y="85" width="70" height="8" fill="#bdc3c7" rx="3"/>
                <rect x="32" y="55" width="56" height="30" fill="#ffb3c6" stroke="#ff477e" stroke-width="1.5"/>
                <rect x="32" y="65" width="56" height="5" fill="#ffffff"/>
                <rect x="42" y="32" width="36" height="23" fill="#ff7096" stroke="#ff477e" stroke-width="1.5"/>
                <circle cx="60" cy="32" r="5" fill="#e74c3c"/>
                <rect x="58" y="16" width="4" height="16" fill="#3498db"/>
                <polygon class="flame-node" points="60,2 56,14 64,14" fill="#f1c40f"/>
            </svg>
        </div>

        <!-- Snoopy y Woodstock -->
        <div class="characters-stage">
